[project]
name = "mcp-saas-platform"
version = "0.2.0"
description = "Pattern-neutral MCP SaaS platform runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.6,<5.0.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "joserfc>=1.8.0",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "pypdf>=7.0.1,<8.0.0",
]

[project.scripts]
# The distribution identity follows deploy/component-identities.json.
mcp-saas-platform = "example_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_server", "src/clusters"]

[dependency-groups]
# Dev + eval-only deps. Install with `uv sync --group dev`.
# The Phoenix evaluation harness (see eval/) is not scaffolded in this template
# on purpose — add these when you build it per the mcp-eval skill.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "markdown>=3.5",
    "requests>=2.32.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
# D100-D104: every public module, class, method and function carries a docstring,
# so the code explains itself. Tests are exempt.
select = ["E", "F", "I", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
# Keep long prompt and evaluation-report text intact; wrapping it changes content.

"tests/**" = ["D"]
"**/tests/**" = ["D"]
"**/test_*.py" = ["D"]
"**/conftest.py" = ["D"]

[tool.ruff.lint.isort]
known-third-party = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
